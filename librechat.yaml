  modelSelect: false
  parameters: false
  presets: false
  prompts: false
  bookmarks: false
  projects: false
  multiConvo: false
  memories: false
  temporaryChat: false
  runCode: false
  webSearch: false
  fileSearch: false
  fileCitations: false
  contextUsage: false
  contextCost: false
